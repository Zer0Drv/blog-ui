name: CD

# 前端 CD：同 SHA 完整 CI/test/build → production 审批 → 核对产物 → 同步 MinIO
# 前置（一次性）：
#   1) 同后端：本机注册 self-hosted runner（任一仓库注册一次，整机可用）
#   2) 仓库 Settings → Secrets：MINIO_ACCESS_KEY / MINIO_SECRET_KEY（部署机 MinIO 凭据）
# 前端不走镜像：dist 推对象存储，Nginx 网关（blog 仓库 deploy/nginx.conf）边缘缓存直出
# 版本归档：每次发布把 dist 镜像到 MinIO blog-frontend-releases/sha-<8位>/（不回删）；
# 回滚：Actions → CD → Run workflow 填 rollback_tag ——跳过构建，把对应归档镜像回线上桶根
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'index.html'
      - '.github/workflows/cd.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - '.gitattributes'
      - 'tests/**'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: '回滚到指定产物 tag（如 sha-1a2b3c4d，见 MinIO blog-frontend-releases 桶）；留空 = 正常构建部署最新'
        required: false
        type: string

concurrency:
  group: cd-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---- 门控：限定 main，解析跳过标记与回滚输入 ----
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.flag.outputs.deploy }}
      rollback: ${{ steps.flag.outputs.rollback }}
    steps:
      - name: 校验发布来源和输入
        id: flag
        env:
          RELEASE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo '::error::只能从 main 运行发布或回滚'; exit 1
          fi
          if [[ -n "$ROLLBACK_TAG" ]]; then
            if [[ ! "$ROLLBACK_TAG" =~ ^sha-[0-9a-f]{8}$ ]]; then
              echo '::error::rollback_tag 必须为 sha- 加 8 位小写十六进制提交标识'; exit 1
            fi
            echo 'rollback=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rollback=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" == push && "${MSG,,}" == *'[skip cd]'* ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "检测到 [skip cd]：本次提交跳过部署"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # 调用整个 CI，新增集成/E2E job 也必须成功后才允许消费产物。
  ci:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && needs.gate.outputs.rollback == 'false'
    uses: ./.github/workflows/ci.yml

  # ---- 阶段 2：自托管 runner（部署机）推送到 MinIO ----
  deploy:
    needs: [gate, ci]
    # 回滚显式允许 CI 跳过；正常发布要求整个 CI 成功、产物提交与调用提交一致。
    if: >-
      ${{ always() && !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true' &&
          ((needs.gate.outputs.rollback == 'true' && needs.ci.result == 'skipped') ||
           (needs.gate.outputs.rollback == 'false' && needs.ci.result == 'success' && needs.ci.outputs.sha == github.sha && needs.ci.outputs.artifact != '')) }}
    runs-on: self-hosted
    environment: production
    defaults:
      run:
        # 默认 shell 是 PowerShell：对中文/引号处理与 bash 不同，统一走 Git Bash
        shell: 'D:\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - name: 获取同提交的校验工具
        if: needs.gate.outputs.rollback == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: .github/scripts

      - name: Set up Node.js
        if: needs.gate.outputs.rollback == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 下载构建产物（回滚模式不需要）
        if: needs.gate.outputs.rollback == 'false'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.ci.outputs.artifact }}
          path: ${{ runner.temp }}/frontend-${{ github.run_id }}-${{ github.run_attempt }}/dist

      - name: 校验并发布已通过 CI 的产物
        if: needs.gate.outputs.rollback == 'false'
        working-directory: ${{ runner.temp }}/frontend-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          FRONTEND_TAG: ${{ needs.ci.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          "$BASH" "$GITHUB_WORKSPACE/release-tools/.github/scripts/publish-frontend.sh"
          echo "前端提交：\`$RELEASE_SHA\`；归档：\`$FRONTEND_TAG\`；清单：\`/release.json\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 实际网关业务冒烟
        if: needs.gate.outputs.rollback == 'false'
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL || 'http://localhost' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          report="$RUNNER_TEMP/gateway-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node "$GITHUB_WORKSPACE/release-tools/.github/scripts/gateway-smoke.mjs" "$GATEWAY_URL" "$RELEASE_SHA" > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: 保存网关冒烟证据
        if: always() && needs.gate.outputs.rollback == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: gateway-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 90
          if-no-files-found: warn

      - name: 恢复历史归档
        if: needs.gate.outputs.rollback == 'true'
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          FRONTEND_TAG: ${{ inputs.rollback_tag }}
        run: |
          mc alias set deploy http://localhost:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          # 保留旧归档布局与已验证的 cp 语义；历史产物认证和回滚后业务冒烟继续由 #58 跟踪。
          if [ -z "$(mc ls "deploy/blog-frontend-releases/$FRONTEND_TAG/dist/" 2>/dev/null)" ]; then
            echo "归档不存在：$FRONTEND_TAG（见 MinIO blog-frontend-releases 桶）"; exit 1
          fi
          mc rm --recursive --force deploy/blog-frontend/
          mc cp --recursive "deploy/blog-frontend-releases/$FRONTEND_TAG/dist/" deploy/blog-frontend/
          echo "已回滚到 $FRONTEND_TAG" >> "$GITHUB_STEP_SUMMARY"
