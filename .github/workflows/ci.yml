name: CI

on:
  workflow_call:
    outputs:
      sha:
        value: ${{ jobs.build.outputs.sha }}
      tag:
        value: ${{ jobs.build.outputs.tag }}
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      artifact: ${{ steps.release.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # pnpm v12（与 pnpm-workspace.yaml 的 allowBuilds 字段配套）
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      # 与本地开发对齐（本机 v24）：Node 24 LTS；Node 20 已 EOL
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # lockfile 已与 package.json 同步（本地 pnpm install --frozen-lockfile 通过），
      # 保持严格模式：package.json 改了却没更新 lockfile 时直接失败，而不是静默装出另一套依赖树
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: 生成发布清单
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node .github/scripts/release-manifest.mjs create dist "$RELEASE_SHA" "$RUN_URL"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${RELEASE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "artifact=frontend-dist-$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: 上传已验证产物
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  # Required by the reusable CI as well as PRs: real Chromium + both applications + disposable infrastructure.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_E2E_DIR: ${{ github.workspace }}/backend-e2e
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Checkout exact backend fixture
        uses: actions/checkout@v7
        with:
          repository: Zer0Drv/blog
          ref: ec903ffd4dabf83d8e8d2bf62d1be681dbc0a76c
          path: backend-e2e
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Compile backend fixture with existing build plugins
        working-directory: backend-e2e
        run: mvn -B -DskipTests package
      - name: Browser end-to-end flows
        run: pnpm test:e2e
      - name: Clean only this run's test infrastructure
        if: always()
        run: node e2e/cleanup.mjs
      - name: Save browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn

  performance-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_E2E_DIR: ${{ github.workspace }}/backend-e2e
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: Zer0Drv/blog
          ref: ec903ffd4dabf83d8e8d2bf62d1be681dbc0a76c
          path: backend-e2e
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compile isolated backend
        working-directory: backend-e2e
        run: mvn -B -DskipTests package
      - name: Build production frontend
        run: pnpm run build
      - name: Measure fixed cold-page scenarios
        run: pnpm test:performance
      - name: Clean this run's test infrastructure
        if: always()
        run: node e2e/cleanup.mjs
      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          retention-days: 90
          if-no-files-found: error
