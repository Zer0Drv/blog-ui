name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm v12（与 pnpm-workspace.yaml 的 allowBuilds 字段配套）
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # lockfile 已与 package.json 同步（本地 pnpm install --frozen-lockfile 通过），
      # 保持严格模式：package.json 改了却没更新 lockfile 时直接失败，而不是静默装出另一套依赖树
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
